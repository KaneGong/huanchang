name: Check community and cloud adapter
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: isolated-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - run: python -m unittest tests.test_readiness tests.test_cloud_config -v
      - run: python -m unittest tests.test_cloud -v
        env:
          HUANCHANG_TEST_DATABASE_URL: postgresql://postgres:isolated-ci-only@127.0.0.1:5432/postgres?sslmode=disable
      - run: |
          for file in outputs/huanchang-v1/*.mjs; do node --check "$file"; done
          python scripts/build_vercel.py
