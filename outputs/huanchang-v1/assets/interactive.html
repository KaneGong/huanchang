<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>另一种界面 · 互动示例</title><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,"PingFang SC",sans-serif;color:#22302b;background:#edf2fa}.stage{height:340px;position:relative;overflow:hidden;background:linear-gradient(135deg,#e5efff,#f4e9f1);--blue:#75a9f6;--pink:#d1b9ee;--sun:#ffa844}.shape{position:absolute;transition:background .5s,transform .65s;box-shadow:0 18px 30px #536a8c20}.one{left:14%;top:16%;width:23%;height:70%;border-radius:50% 50% 0 0;background:var(--blue);transform:rotate(-15deg)}.two{left:45%;top:24%;width:35%;height:39%;border-radius:50%;background:var(--pink);transform:rotate(35deg)}.three{left:65%;top:12%;width:15%;aspect-ratio:1;border-radius:50%;background:var(--sun)}.floor{position:absolute;left:-5%;bottom:-15%;width:115%;height:39%;border-radius:50%;background:#fff8;transform:rotate(-10deg)}.caption{position:absolute;top:22px;left:24px;font-size:12px;letter-spacing:1px}.controls{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:16px 20px;background:#fff}button{font:inherit;font-size:12px;background:#f3f5ee;border:1px solid #dfe5d7;color:inherit;border-radius:24px;padding:9px 16px;cursor:pointer}button:focus-visible{outline:2px solid #63752a;outline-offset:3px}.selected{background:#d2f354;border-color:#d2f354}#status{font-size:11px;color:#677163;margin-left:auto} @media(prefers-reduced-motion:reduce){.shape{transition:none}}</style><div class="stage" aria-label="可调整配色和排列的几何空间"><span class="caption">色彩与空间 / INTERACTIVE STUDY</span><div class="shape one"></div><div class="shape two"></div><div class="shape three"></div><div class="floor"></div></div><div class="controls"><button class="selected" data-palette="0" aria-pressed="true">晴空</button><button data-palette="1" aria-pressed="false">苔与光</button><button data-palette="2" aria-pressed="false">暮色</button><button id="arrange">重新排列</button><button id="reset">复原</button><span id="status" role="status">晴空 · 原始排列</span></div><script src="interactive.js"></script></html>
