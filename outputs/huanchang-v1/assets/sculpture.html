<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>流动的形状 · 几何体预览</title><style>*{box-sizing:border-box}body{margin:0;background:#eaf5f8;font-family:-apple-system,"PingFang SC",sans-serif;color:#23484c}.scene{position:relative}canvas{display:block;width:100%;height:370px;background:radial-gradient(ellipse at 50% 70%,#d4edf0,#f0f9fb);touch-action:pan-y}.caption{position:absolute;left:22px;top:20px;font-size:11px;letter-spacing:1px;pointer-events:none}.controls{background:#fff;padding:15px 20px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}button{font:inherit;border:1px solid #dce8e7;background:#f5f9f9;color:inherit;border-radius:22px;padding:9px 15px;cursor:pointer;font-size:12px}button:focus-visible,canvas:focus-visible{outline:2px solid #55762a;outline-offset:-3px}#angle{font-size:11px;margin-left:auto;color:#6d8585}</style><div class="scene"><span class="caption">形态预览 / 简化几何示例</span><canvas tabindex="0" role="img" aria-label="青色折面几何体，使用左右方向键旋转"></canvas></div><div class="controls"><button id="left" aria-label="向左旋转 30 度">← 向左旋转</button><button id="right" aria-label="向右旋转 30 度">向右旋转 →</button><button id="reset">复原</button><span id="angle" role="status">角度 0°</span></div><script src="sculpture.js"></script></html>
